name: CICD

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build the Docker image
        run: docker build -t smukeshkumar240/node_docker:latest .

      - name: Push the Docker image
        run: docker push smukeshkumar240/node_docker:latest

  deploy:
    needs: build
    runs-on: [aws-ec2]

    steps:
      - name: create docker network
        run: sudo docker network create app-network || true

      - name: pull the latest image
        run: sudo docker pull smukeshkumar240/node_docker:latest  

      - name: remove old container
        run: sudo docker rm -f node_docker-container || true

      - name: run the new container
        run: |
          sudo docker run -d \
            --name node_docker-container \
            --network app-network \
            --restart always \
            -p 8000:8000 \
            -e PORT=8000 \
            smukeshkumar240/node_docker:latest